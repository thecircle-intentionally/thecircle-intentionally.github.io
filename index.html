<style>
  :root{
    --bg:#0b0a09; --card:#151210; --line:rgba(201,166,107,.28);
    --gold:#c9a66b; --gold2:#e6cf9f; --ivory:#f3ece0; --muted:#a89f92;
    --burg:#6e1f2a; --burg2:#8a2a37;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    background:var(--bg); color:var(--ivory);
    font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif; font-weight:300;
    min-height:100vh;
    background-image:
      radial-gradient(ellipse 80% 45% at 50% -5%, rgba(110,31,42,.45), transparent 70%),
      radial-gradient(ellipse 60% 40% at 50% 105%, rgba(201,166,107,.10), transparent 70%);
    background-attachment:fixed;
  }
  .wrap{max-width:460px;margin:0 auto;padding:28px 22px calc(40px + env(safe-area-inset-bottom))}
  .lang{display:flex;justify-content:flex-end;gap:6px;margin-bottom:6px}
  .lang button{background:none;border:1px solid var(--line);color:var(--muted);font:500 11px Inter,sans-serif;
    letter-spacing:.12em;padding:5px 10px;border-radius:20px;cursor:pointer}
  .lang button.on{color:var(--bg);background:var(--gold);border-color:var(--gold)}

  header{text-align:center;padding:8px 0 4px}
  .seal{width:84px;height:auto;display:block;filter:drop-shadow(0 6px 10px rgba(0,0,0,.55))}
  h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-size:38px;letter-spacing:.22em;
    color:var(--gold2);padding-left:.22em}
  .tagline{font-size:10.5px;letter-spacing:.32em;text-transform:uppercase;color:var(--gold);margin-top:6px}
  .rule{width:46px;height:1px;background:var(--gold);margin:20px auto;opacity:.7}
  .lead{font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-size:23px;line-height:1.3;color:var(--ivory)}
  .sub{font-size:14px;line-height:1.6;color:var(--muted);margin-top:12px}

  .btns{display:flex;flex-direction:column;gap:12px;margin:28px 0 8px}
  .btn{display:flex;align-items:center;gap:14px;text-decoration:none;color:var(--ivory);
    background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px 18px;
    transition:transform .15s,border-color .15s;-webkit-tap-highlight-color:transparent}
  .btn:active{transform:scale(.98)}
  .btn:hover{border-color:var(--gold)}
  .btn svg{width:22px;height:22px;flex:none;fill:var(--gold)}
  .btn .t{flex:1;min-width:0}
  .btn b{display:block;font-weight:500;font-size:15.5px}
  .btn small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
  .btn .arr{color:var(--gold);font-size:18px}
  .btn.main{background:linear-gradient(135deg,var(--burg2),var(--burg));border-color:rgba(230,207,159,.45);
    box-shadow:0 10px 30px rgba(110,31,42,.45)}
  .btn.main svg{fill:var(--gold2)} .btn.main small{color:#e8d6c0}
  .hint{text-align:center;font-size:12px;color:var(--muted);margin-top:6px}
  .hint code{color:var(--gold2);font-family:inherit;font-weight:500;cursor:pointer;border-bottom:1px dashed var(--gold)}

  section{margin-top:40px}
  h2{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-size:26px;color:var(--gold2);
    text-align:center;margin-bottom:18px}
  .steps{list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:14px}
  .steps li{counter-increment:s;display:flex;gap:16px;align-items:flex-start}
  .steps li::before{content:counter(s);flex:none;width:34px;height:34px;border-radius:50%;border:1px solid var(--gold);
    color:var(--gold2);font:600 18px "Cormorant Garamond",Georgia,serif;display:flex;align-items:center;justify-content:center}
  .steps b{font-weight:500;font-size:15px;display:block}
  .steps span{font-size:13.5px;color:var(--muted);line-height:1.5}
  .vals{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .val{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
  .val b{font-family:"Cormorant Garamond",Georgia,serif;font-size:19px;font-weight:600;color:var(--gold2);display:block}
  .val span{font-size:12.5px;color:var(--muted);line-height:1.45;display:block;margin-top:4px}
  .quote{font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-size:21px;line-height:1.35;
    text-align:center;color:var(--ivory);border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:22px 6px}
  .cta2{margin-top:26px}
  footer{text-align:center;margin-top:44px;font-size:11.5px;color:#7a7268;line-height:1.7}
  footer a{color:var(--muted)}


  /* seal stamp intro */
  .sealbox{position:relative;width:124px;height:124px;margin:0 auto 18px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 50% 40%,#1d1814,#0b0a09 70%);
    box-shadow:inset 0 0 0 1px rgba(201,166,107,.55),0 0 0 6px rgba(201,166,107,.06),0 18px 40px rgba(0,0,0,.6)}
  .sealbox .seal{position:relative;z-index:2;animation:stamp 1.05s cubic-bezier(.2,.7,.2,1) .15s both}
  .sealbox::before{content:"";position:absolute;inset:-6px;border-radius:50%;border:1.5px solid var(--gold);
    opacity:0;animation:ring 1s ease-out .78s both}
  .sealbox::after{content:"";position:absolute;inset:0;border-radius:50%;z-index:3;pointer-events:none;
    background:linear-gradient(115deg,transparent 35%,rgba(255,240,205,.55) 50%,transparent 65%);
    background-size:250% 100%;background-position:120% 0;opacity:0;animation:shine 1.1s ease-in-out 1.15s both}
  @keyframes stamp{
    0%{transform:scale(2.3) rotate(-14deg);opacity:0;filter:blur(6px) drop-shadow(0 40px 30px rgba(0,0,0,.8))}
    55%{transform:scale(1.06) rotate(1.5deg);opacity:1;filter:blur(0)}
    68%{transform:scale(.93,.9) rotate(0)}
    82%{transform:scale(1.02)}
    100%{transform:scale(1);opacity:1}}
  @keyframes ring{0%{transform:scale(.9);opacity:0}2%{opacity:.9}100%{transform:scale(1.55);opacity:0}}
  @keyframes shine{0%{opacity:0;background-position:120% 0}5%{opacity:1}95%{opacity:1}100%{opacity:0;background-position:-20% 0}}
  .reveal{animation:up .7s ease-out both}
  .r1{animation-delay:.75s}.r2{animation-delay:.85s}.r3{animation-delay:.95s}.r4{animation-delay:1.05s}
  @keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.sealbox .seal,.sealbox::before,.sealbox::after,.reveal{animation:none!important}}


  /* in-app helper sheet */
  .sheet{position:fixed;inset:0;z-index:20;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.65)}
  .sheet.on{display:flex}
  .sheet .box{width:100%;max-width:460px;background:#15110f;border-top:1px solid var(--gold);border-radius:20px 20px 0 0;
    padding:22px 20px calc(24px + env(safe-area-inset-bottom));animation:up .25s ease-out both}
  .sheet h3{font-family:"Cormorant Garamond",Georgia,serif;font-size:24px;color:var(--gold2);margin-bottom:6px}
  .sheet p{font-size:14px;color:var(--muted);line-height:1.5;margin-bottom:14px}
  .sheet ol{margin:0 0 16px 18px;font-size:14.5px;line-height:1.6}
  .sheet ol b{color:var(--gold2);font-weight:500}
  .sheet .sb{display:block;width:100%;text-align:center;padding:14px;border-radius:12px;font:500 15px Inter,sans-serif;
    margin-top:10px;cursor:pointer;text-decoration:none}
  .sheet .gold{background:var(--gold);color:#1a1410;border:0}
  .sheet .ghost{background:none;color:var(--ivory);border:1px solid var(--line)}
  .sheet .close{background:none;border:0;color:var(--muted);font-size:13px;margin-top:12px}

  /* in-app browser banner */
  .iab{display:none;position:sticky;top:0;z-index:5;background:var(--gold);color:#1a1410;font-size:13px;
    line-height:1.4;padding:10px 44px 10px 14px;text-align:left}
  .iab b{font-weight:600}
  .iab .x{position:absolute;right:10px;top:8px;background:none;border:0;font-size:20px;color:#1a1410}
  .iab .ar{position:absolute;right:42px;top:-2px;font-size:22px}
  body.inapp .iab{display:block}
  .toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:var(--gold);color:#1a1410;
    padding:10px 16px;border-radius:20px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}
  .toast.on{opacity:1}
</style>
</head>
<body>
<div class="iab" id="iab">
  <span data-i="iab"></span>
  <button class="x" aria-label="close" onclick="document.body.classList.remove('inapp')">×</button>
</div>

<div class="wrap">

const nl=(navigator.language||'').slice(0,2);let L={uk:'uk',ro:'ro',en:'en'}[nl]||'ru';
try{const s=localStorage.getItem('tc_lang');if(s&&T[s])L=s}catch(e){}
const q=new URLSearchParams(location.search).get('lang');if(q&&T[q])L=q;
function apply(){
  document.documentElement.lang=L;
  document.querySelectorAll('[data-i]').forEach(e=>{e.innerHTML=T[L][e.dataset.i]});
  document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('on',b.dataset.l===L));
}
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>{L=b.dataset.l;try{localStorage.setItem('tc_lang',L)}catch(e){};apply()});
apply();

const ua=navigator.userAgent||'';
const inApp=/musical_ly|TikTok|Bytedance|trill|Instagram|FBAN|FBAV|FB_IAB/i.test(ua);
const isAndroid=/Android/i.test(ua);
if(inApp) document.body.classList.add('inapp');

function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2200)}
document.getElementById('copy').onclick=()=>{
  const v='TheCircleMatchBot';
  (navigator.clipboard?navigator.clipboard.writeText(v):Promise.reject()).then(()=>toast(T[L].copied)).catch(()=>{
    const i=document.createElement('input');i.value=v;document.body.appendChild(i);i.select();try{document.execCommand('copy');toast(T[L].copied)}catch(e){};i.remove()});
};

/* Telegram buttons */
const isIOS=/iPhone|iPad|iPod/i.test(ua);
let curName='TheCircleMatchBot', curHref='https://t.me/TheCircleMatchBot';
function copyText(v){
  return (navigator.clipboard?navigator.clipboard.writeText(v):Promise.reject()).catch(()=>{
    const i=document.createElement('input');i.value=v;document.body.appendChild(i);i.select();try{document.execCommand('copy')}catch(e){};i.remove()});
}
function openSheet(name,href){
  curName=name;curHref=href;
  const sh=document.getElementById('sheet');
  sh.querySelectorAll('[data-i]').forEach(e=>{e.innerHTML=T[L][e.dataset.i].replace('__NAME__',name)});
  const saf=document.getElementById('sh_safari');
  if(isIOS){saf.style.display='block';saf.href='x-safari-'+location.href.split('#')[0];}else saf.style.display='none';
  document.getElementById('sh_copy').style.display=name?'block':'none';
  sh.classList.add('on');
}
document.getElementById('sh_close').onclick=()=>document.getElementById('sheet').classList.remove('on');
document.getElementById('sheet').onclick=e=>{if(e.target.id==='sheet')e.currentTarget.classList.remove('on')};
document.getElementById('sh_copy').onclick=()=>copyText(curName).then(()=>toast(T[L].copied));
document.querySelectorAll('a.tg').forEach(a=>a.addEventListener('click',ev=>{
  const href=a.getAttribute('href');
  if(!/^https:\/\/t\.me\//.test(href)) return;
  const path=href.replace('https://t.me/','').split('?')[0];
  const name=(path.startsWith('+')||path.startsWith('joinchat/'))?'':path;
  if(inApp){ ev.preventDefault(); openSheet(name,href); return; }
  /* normal browsers: let t.me handle it (opens the Telegram app) */
}));
</script>
